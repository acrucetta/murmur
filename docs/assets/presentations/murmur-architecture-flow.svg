<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#0b3b56"/>
    </marker>
    <style>
      .title { font: 700 44px 'Avenir Next', Arial, sans-serif; fill: #0b3b56; }
      .label { font: 700 24px 'Avenir Next', Arial, sans-serif; fill: #0f172a; }
      .sub { font: 500 18px 'Avenir Next', Arial, sans-serif; fill: #334155; }
      .box { stroke: #0b3b56; stroke-width: 2.5; rx: 18; }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>
  <text x="70" y="95" class="title">Murmur End-to-End Architecture</text>

  <rect class="box" x="90" y="170" width="280" height="120" fill="#dbeafe"/>
  <text x="135" y="220" class="label">Hotkey Listener</text>
  <text x="135" y="252" class="sub">press / hold / release</text>

  <rect class="box" x="430" y="150" width="370" height="160" fill="#e0f2fe"/>
  <text x="490" y="212" class="label">Session Coordinator</text>
  <text x="490" y="244" class="sub">workflow + state transitions</text>
  <text x="490" y="274" class="sub">single control point</text>

  <rect class="box" x="880" y="160" width="300" height="90" fill="#dcfce7"/>
  <text x="935" y="214" class="label">Permission Checks</text>

  <rect class="box" x="880" y="280" width="300" height="90" fill="#dcfce7"/>
  <text x="935" y="334" class="label">Microphone Capture</text>

  <rect class="box" x="90" y="510" width="260" height="100" fill="#bfdbfe"/>
  <text x="120" y="568" class="label">Moonshine Voice</text>

  <rect class="box" x="390" y="510" width="260" height="100" fill="#e9d5ff"/>
  <text x="430" y="568" class="label">Text Cleanup</text>

  <rect class="box" x="690" y="510" width="290" height="100" fill="#fde68a"/>
  <text x="735" y="568" class="label">Optional Rewrite</text>

  <rect class="box" x="1020" y="510" width="250" height="100" fill="#c7d2fe"/>
  <text x="1060" y="568" class="label">Text Insertion</text>

  <rect class="box" x="1310" y="510" width="220" height="100" fill="#bfdbfe"/>
  <text x="1341" y="557" class="label">Status +</text>
  <text x="1341" y="585" class="label">History + Logs</text>

  <line x1="370" y1="230" x2="430" y2="230" stroke="#0b3b56" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="800" y1="200" x2="880" y2="200" stroke="#0b3b56" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="800" y1="270" x2="880" y2="325" stroke="#0b3b56" stroke-width="3" marker-end="url(#arrow)"/>

  <line x1="1030" y1="370" x2="1030" y2="440" stroke="#0b3b56" stroke-width="3"/>
  <line x1="1030" y1="440" x2="220" y2="440" stroke="#0b3b56" stroke-width="3"/>
  <line x1="220" y1="440" x2="220" y2="510" stroke="#0b3b56" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="350" y1="560" x2="390" y2="560" stroke="#0b3b56" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="650" y1="560" x2="690" y2="560" stroke="#0b3b56" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="980" y1="560" x2="1020" y2="560" stroke="#0b3b56" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1270" y1="560" x2="1310" y2="560" stroke="#0b3b56" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
