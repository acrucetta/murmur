<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <marker id="arrow3" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#312e81"/>
    </marker>
    <style>
      .title { font: 700 44px 'Avenir Next', Arial, sans-serif; fill: #312e81; }
      .label { font: 700 26px 'Avenir Next', Arial, sans-serif; fill: #111827; }
      .text { font: 500 21px 'Avenir Next', Arial, sans-serif; fill: #374151; }
      .box { stroke: #312e81; stroke-width: 2.5; rx: 18; }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg3)"/>
  <text x="70" y="95" class="title">Optional Rewrite Model With Safety Guardrails</text>

  <rect class="box" x="90" y="230" width="360" height="140" fill="#dbeafe"/>
  <text x="140" y="290" class="label">Deterministic Output</text>
  <text x="140" y="325" class="text">always available</text>

  <rect class="box" x="520" y="230" width="300" height="140" fill="#ede9fe"/>
  <text x="560" y="290" class="label">Rewrite Model</text>
  <text x="560" y="325" class="text">optional in smart mode</text>

  <rect class="box" x="890" y="160" width="620" height="400" fill="#fef3c7"/>
  <text x="940" y="220" class="label">Guardrails</text>
  <text x="940" y="275" class="text">1. Keep important symbols (! ? @)</text>
  <text x="940" y="320" class="text">2. Reject unusually long rewrites</text>
  <text x="940" y="365" class="text">3. Reject low-overlap rewrites</text>
  <text x="940" y="410" class="text">4. Skip rewrite for very short recordings</text>
  <text x="940" y="455" class="text">5. Timeout or errors -> fallback immediately</text>

  <rect class="box" x="520" y="620" width="560" height="140" fill="#dcfce7"/>
  <text x="570" y="680" class="label">Final Inserted Text (never blocked)</text>
  <text x="570" y="715" class="text">rewritten if safe, deterministic fallback otherwise</text>

  <line x1="450" y1="300" x2="520" y2="300" stroke="#312e81" stroke-width="3.2" marker-end="url(#arrow3)"/>
  <line x1="820" y1="300" x2="890" y2="300" stroke="#312e81" stroke-width="3.2" marker-end="url(#arrow3)"/>
  <line x1="1200" y1="560" x2="950" y2="620" stroke="#312e81" stroke-width="3.2" marker-end="url(#arrow3)"/>
  <line x1="520" y1="300" x2="520" y2="620" stroke="#94a3b8" stroke-width="2.2" stroke-dasharray="8 8"/>
</svg>
