<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg7" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdf4ff"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <style>
      .title { font: 700 44px 'Avenir Next', Arial, sans-serif; fill: #581c87; }
      .card { stroke: #581c87; stroke-width: 2.5; rx: 20; }
      .label { font: 700 30px 'Avenir Next', Arial, sans-serif; fill: #111827; }
      .text { font: 500 22px 'Avenir Next', Arial, sans-serif; fill: #374151; }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg7)"/>
  <text x="70" y="95" class="title">Safe by Default: The Three Guarantees</text>

  <rect class="card" x="90" y="220" width="450" height="430" fill="#e9d5ff"/>
  <text x="145" y="300" class="label">1. Always Clean First</text>
  <text x="145" y="360" class="text">Rule-based cleanup runs on</text>
  <text x="145" y="395" class="text">every transcript, every time.</text>

  <rect class="card" x="575" y="220" width="450" height="430" fill="#dbeafe"/>
  <text x="640" y="300" class="label">2. Rewrite Is Optional</text>
  <text x="640" y="360" class="text">The model rewrite step is</text>
  <text x="640" y="395" class="text">a quality add-on, not a dependency.</text>

  <rect class="card" x="1060" y="220" width="450" height="430" fill="#dcfce7"/>
  <text x="1120" y="300" class="label">3. Fast Fallback</text>
  <text x="1120" y="360" class="text">On timeout or failure, Murmur</text>
  <text x="1120" y="395" class="text">immediately inserts cleaned text.</text>
</svg>
