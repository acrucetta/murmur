<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#ecfeff"/>
    </linearGradient>
    <marker id="arrow6" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1e3a8a"/>
    </marker>
    <style>
      .title { font: 700 44px 'Avenir Next', Arial, sans-serif; fill: #1e3a8a; }
      .box { stroke: #1e3a8a; stroke-width: 2.5; rx: 18; }
      .label { font: 700 24px 'Avenir Next', Arial, sans-serif; fill: #0f172a; }
      .sub { font: 500 19px 'Avenir Next', Arial, sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg6)"/>
  <text x="70" y="95" class="title">How Murmur Uses Moonshine During Dictation</text>

  <rect class="box" x="90" y="250" width="250" height="170" fill="#dbeafe"/>
  <text x="130" y="315" class="label">Hold Hotkey</text>
  <text x="130" y="348" class="sub">start capture</text>

  <rect class="box" x="390" y="250" width="280" height="170" fill="#bfdbfe"/>
  <text x="425" y="315" class="label">Capture Audio</text>
  <text x="425" y="348" class="sub">microphone frames</text>

  <rect class="box" x="720" y="250" width="300" height="170" fill="#93c5fd"/>
  <text x="755" y="315" class="label">Release Hotkey</text>
  <text x="755" y="348" class="sub">finalize session</text>

  <rect class="box" x="1070" y="250" width="420" height="170" fill="#bae6fd"/>
  <text x="1110" y="315" class="label">Moonshine Transcription</text>
  <text x="1110" y="348" class="sub">local script + local model</text>

  <rect class="box" x="470" y="540" width="660" height="170" fill="#dcfce7"/>
  <text x="560" y="605" class="label">Clean Text -> Optional Rewrite -> Insert</text>
  <text x="560" y="638" class="sub">fast path stays local, fallback keeps it reliable</text>

  <line x1="340" y1="335" x2="390" y2="335" stroke="#1e3a8a" stroke-width="3" marker-end="url(#arrow6)"/>
  <line x1="670" y1="335" x2="720" y2="335" stroke="#1e3a8a" stroke-width="3" marker-end="url(#arrow6)"/>
  <line x1="1020" y1="335" x2="1070" y2="335" stroke="#1e3a8a" stroke-width="3" marker-end="url(#arrow6)"/>
  <line x1="1280" y1="420" x2="800" y2="540" stroke="#1e3a8a" stroke-width="3" marker-end="url(#arrow6)"/>
</svg>
