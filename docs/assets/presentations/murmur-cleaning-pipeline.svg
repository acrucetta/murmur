<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ecfeff"/>
    </linearGradient>
    <marker id="arrow2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#7c2d12"/>
    </marker>
    <style>
      .title { font: 700 44px 'Avenir Next', Arial, sans-serif; fill: #7c2d12; }
      .boxTitle { font: 700 28px 'Avenir Next', Arial, sans-serif; fill: #111827; }
      .text { font: 500 22px 'Avenir Next', Arial, sans-serif; fill: #374151; }
      .small { font: 500 19px 'Avenir Next', Arial, sans-serif; fill: #4b5563; }
      .box { stroke: #7c2d12; stroke-width: 2.5; rx: 18; }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg2)"/>
  <text x="70" y="95" class="title">Deterministic Cleaning Pipeline (Always Runs First)</text>

  <rect class="box" x="70" y="180" width="300" height="500" fill="#fee2e2"/>
  <text x="110" y="245" class="boxTitle">Raw Input</text>
  <text x="110" y="300" class="text">"i i i think</text>
  <text x="110" y="335" class="text">we should should</text>
  <text x="110" y="370" class="text">ship this"</text>

  <rect class="box" x="430" y="180" width="300" height="500" fill="#ffedd5"/>
  <text x="470" y="245" class="boxTitle">Step 1-2</text>
  <text x="470" y="295" class="text">Normalize spacing</text>
  <text x="470" y="330" class="text">Map spoken symbols</text>
  <text x="470" y="390" class="small">"question mark" -> ?</text>
  <text x="470" y="420" class="small">"at sign" -> @</text>

  <rect class="box" x="790" y="180" width="300" height="500" fill="#fef9c3"/>
  <text x="835" y="245" class="boxTitle">Step 3</text>
  <text x="835" y="295" class="text">Repair phrases</text>
  <text x="835" y="330" class="text">Collapse stutters</text>
  <text x="835" y="365" class="text">Keep emphasis</text>
  <text x="835" y="425" class="small">"scratch that"</text>
  <text x="835" y="455" class="small">"no wait"</text>

  <rect class="box" x="1150" y="180" width="360" height="500" fill="#dcfce7"/>
  <text x="1210" y="245" class="boxTitle">Final Output</text>
  <text x="1210" y="310" class="text">"I think we should</text>
  <text x="1210" y="345" class="text">ship this."</text>
  <text x="1210" y="420" class="small">Capitalized + punctuation</text>
  <text x="1210" y="450" class="small">Same input = same output</text>
  <text x="1210" y="480" class="small">No network dependency</text>

  <line x1="370" y1="430" x2="430" y2="430" stroke="#7c2d12" stroke-width="3.2" marker-end="url(#arrow2)"/>
  <line x1="730" y1="430" x2="790" y2="430" stroke="#7c2d12" stroke-width="3.2" marker-end="url(#arrow2)"/>
  <line x1="1090" y1="430" x2="1150" y2="430" stroke="#7c2d12" stroke-width="3.2" marker-end="url(#arrow2)"/>
</svg>
